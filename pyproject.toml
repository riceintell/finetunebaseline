[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riceintell-finetunebaseline"
version = "0.1.0"
description = "在同一批任务上比较两种方式的分数、成本与维护负担"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "riceintell" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://riceintell.github.io"
Repository = "https://github.com/riceintell/finetunebaseline"
Issues = "https://github.com/riceintell/finetunebaseline/issues"

[project.scripts]
finetunebaseline = "finetunebaseline:main"

[tool.setuptools]
py-modules = ["finetunebaseline"]
